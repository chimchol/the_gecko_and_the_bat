<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Gecko and the Bat</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Nunito:wght@400;700&display=swap">
<style>
  /* Layout: one centered column, the game board is the hero. Single dark "desert night" look on purpose. */
  :root {
    --bg: #1f1812;        /* page background, dark brown */
    --panel: #2c2219;
    --text: #f3ead9;
    --muted: #b8a68a;
    --accent: #8bd450;    /* gecko green, used for headings and buttons */
    --font-display: "Press Start 2P", ui-monospace, monospace;
    --font-body: "Nunito", system-ui, sans-serif;
    color-scheme: dark;
  }
  html, body { background: var(--bg); color: var(--text); }
  body { margin: 0;
    font-family: var(--font-body);
    font-size: 16px;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    padding-block: 24px;
  }
  main { max-width: 520px; margin: 0 auto; display: flex; flex-direction: column; gap: 16px; }
  h1 { font-family: var(--font-display); font-size: 18px; color: var(--accent); margin: 0; line-height: 1.6; text-wrap: balance; }
  .step { font-family: var(--font-display); font-size: 10px; letter-spacing: 0.08em; color: var(--muted); }
  canvas { width: 100%; max-width: 480px; aspect-ratio: 1; display: block; border-radius: 6px;
           box-shadow: 0 0 0 4px #6b4a2b, 0 0 0 7px #3d2a17; }
  .stats { display: flex; gap: 12px; }
  .stat { flex: 1; background: var(--panel); border-radius: 6px; padding: 10px 14px; display: flex; justify-content: space-between; align-items: baseline; }
  .stat span { font-size: 13px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.08em; }
  .stat b { font-family: var(--font-display); font-size: 16px; color: var(--accent); font-variant-numeric: tabular-nums; }
  .bar { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
  .info { flex: 1; min-width: 0; background: var(--panel); border-radius: 6px; padding: 12px 14px; color: var(--muted); line-height: 1.5; }
  .info b { color: var(--text); }
  button { font-family: var(--font-display); font-size: 10px; background: var(--accent); color: #142008;
           border: 0; border-radius: 6px; padding: 14px 16px; cursor: pointer; }
  button.secondary { background: var(--panel); color: var(--text); box-shadow: inset 0 0 0 2px var(--muted); }
  button:focus-visible { outline: 3px solid var(--text); outline-offset: 2px; }
</style>
</head>
<body>

<main>
  <div class="step">STEP 7 · A NEW ANIMAL</div>
  <h1>The Gecko and the Bat</h1>
  <div class="stats">
    <div class="stat"><span>Flies</span><b id="score">0</b></div>
    <div class="stat"><span>Level</span><b id="level">1</b></div>
    <div class="stat"><span>Best</span><b id="best">0</b></div>
  </div>
  <canvas id="board" width="480" height="480"></canvas>
  <div class="bar">
    <div class="info" id="info">Press an <b>arrow key</b> to start.</div>
    <button id="sound" class="secondary">Sound: on</button>
    <button id="restart">Restart</button>
  </div>
</main>

<script>
// =====================================================
//  THE BOARD
//  The game happens on a square grid, like graph paper.
//  Every square has an address: x (left to right)
//  and y (top to bottom). Counting starts at 0.
// =====================================================

const GRID_SIZE = 20;   // the board is 20 squares wide and 20 squares tall
const CELL = 24;        // each square is 24 pixels big (20 x 24 = 480 pixels)

const canvas = document.getElementById("board");
const pen = canvas.getContext("2d");

// Draw one square at grid position (x, y) in a color
function drawSquare(x, y, color) {
  pen.fillStyle = color;
  pen.fillRect(x * CELL, y * CELL, CELL, CELL);
}

// Draw the whole board: a checkerboard of two sandy colors, like a desert
function drawBoard() {
  for (let y = 0; y < GRID_SIZE; y++) {
    for (let x = 0; x < GRID_SIZE; x++) {
      const isEven = (x + y) % 2 === 0;
      drawSquare(x, y, isEven ? "#e6cf9a" : "#dcc188");
    }
  }
}

// =====================================================
//  THE GECKO
//  The gecko is 3 squares long: head, body and tail.
//  It moves like the snake did (new head in front,
//  remove the tail) but it NEVER grows, so it can't
//  bite itself. Instead, every fly makes it FASTER.
// =====================================================

// Speed settings. The gecko moves once every so many milliseconds (1000 = 1 second).
// A SMALLER number means FASTER.
const START_SPEED = 150;      // speed at the start
const SPEED_UP_PER_FLY = 1.5; // every fly, the gecko waits 1.5 ms less between moves
const FASTEST_SPEED = 70;     // it never gets faster than this
const FLIES_PER_LEVEL = 10;   // a new level (and a bat!) every 10 flies
const FLY_SPEED = 20;         // on level 1 the fly buzzes around slowly: 20 pixels per second (less than a square)
const FLY_SPEED_PER_LEVEL = 6; // each new level, flies get 6 pixels per second faster
const FLY_MAX_SPEED = 50;     // but never faster than this
const FLY_SPAWN_TIME = 3;     // a new fly arrives every 3 seconds...
const MAX_FLIES = 5;          // ...until there are 5 flies buzzing around
const TONGUE_RANGE = CELL * 2; // the tongue reaches 2 squares in front of the gecko
const TONGUE_TIME = 0.2;      // the tongue shoots out and back in 0.2 seconds

// Bat settings
const BAT_CHASE_TIME = 10;        // the bat chases you for 10 seconds
const BAT_WARNING_TIME = 0.5;     // a warning mark shows on the bat's square half a second before it appears
const BAT_START_RATIO = 0.55;     // on level 2 the bat flies at 55% of the gecko's speed
const BAT_RATIO_PER_LEVEL = 0.04; // each level it gets 4% closer to the gecko's speed
const BAT_MAX_RATIO = 0.7;        // but never faster than 70% of the gecko
const CATCH_DISTANCE = CELL * 0.7; // this close to the head = caught!

// Directions: how much x and y change in one step
const UP    = { x: 0,  y: -1 };
const DOWN  = { x: 0,  y: 1 };
const LEFT  = { x: -1, y: 0 };
const RIGHT = { x: 1,  y: 0 };

let gecko;          // the list of 3 squares: head, body, tail
let direction;      // where the gecko is going right now
let nextDirection;  // where the player wants to go next
let started;        // has the player pressed a key yet?
let gameOver;       // did the gecko crash or get caught?
let flies;          // a LIST of flies, each { x, y, angle } in PIXELS, because they fly freely like the bat
let flyTimer;       // seconds until the next fly arrives
let tongue;         // the tongue while it's out: { fly, timeLeft }, or null when it's in the mouth
let score;          // how many flies the gecko has eaten
let level;          // which level we are on
let bat;            // the bat: { x, y, state, timeLeft }, or null when there is no bat
let steps = 0;      // how many moves the gecko made (used to wiggle its legs)
let paused = false; // is the game paused?
let best = loadBest(); // the best score ever, remembered by the browser
let newBest = false;   // did we just beat the best score?
let soundOn = true;    // are sounds switched on?

// Put everything back to the beginning
function resetGame() {
  gecko = [
    { x: 5, y: 10 },   // head
    { x: 4, y: 10 },   // body
    { x: 3, y: 10 },   // tail
  ];
  direction = RIGHT;
  nextDirection = RIGHT;
  started = false;
  gameOver = false;
  score = 0;
  level = 1;
  bat = null;
  paused = false;
  newBest = false;
  flies = [];
  spawnFly();               // start with one fly
  flyTimer = FLY_SPAWN_TIME;
  tongue = null;
  updateStats();
  document.getElementById("info").innerHTML = "Press an <b>arrow key</b> to start. <b>P</b> pauses, <b>M</b> turns sound on or off.";
  draw();
}

// Where will the head be after the next step?
function nextHead() {
  const head = gecko[0];
  return { x: head.x + direction.x, y: head.y + direction.y };
}

// Is this square outside the board?
function isOutside(square) {
  return square.x < 0 || square.x >= GRID_SIZE || square.y < 0 || square.y >= GRID_SIZE;
}

// Move the gecko one square: new head in front, remove the tail. It always stays 3 long.
function moveGecko(newHead) {
  gecko.unshift(newHead);
  gecko.pop();
  steps = steps + 1;
}

// =====================================================
//  FLIES AND LEVELS
// =====================================================

// Add a new fly on a random square that is NOT under the gecko, facing a random way
function spawnFly() {
  let square;
  do {
    square = {
      x: Math.floor(Math.random() * GRID_SIZE),   // a random whole number from 0 to 19
      y: Math.floor(Math.random() * GRID_SIZE),
    };
  } while (isOnGecko(square));   // landed on the gecko? try again

  const center = cellCenter(square);
  flies.push({ x: center.x, y: center.y, angle: Math.random() * Math.PI * 2 });   // angle = which way it flies
}

// Everything about flies, about 60 times a second
function updateFlies(seconds) {
  for (const fly of flies) moveFly(fly, seconds);

  if (started) {
    // New flies: every 3 seconds (if there's room), or right away if there are none left
    flyTimer = flyTimer - seconds;
    if (flyTimer <= 0 || flies.length === 0) {
      if (flies.length < MAX_FLIES) spawnFly();
      flyTimer = FLY_SPAWN_TIME;
    }

    updateTongue(seconds);
    if (tongue === null) tryToCatchAFly();
  }
}

// Move one fly a tiny bit. It wobbles left and right as it goes, and bounces off the edges.
function moveFly(fly, seconds) {
  fly.angle = fly.angle + (Math.random() - 0.5) * 0.4;   // turn a little, randomly
  const speed = Math.min(FLY_SPEED + (level - 1) * FLY_SPEED_PER_LEVEL, FLY_MAX_SPEED);
  fly.x = fly.x + Math.cos(fly.angle) * speed * seconds;
  fly.y = fly.y + Math.sin(fly.angle) * speed * seconds;

  // Bounce off the edges (stay half a square away from the wall)
  const edge = CELL / 2;
  if (fly.x < edge || fly.x > canvas.width - edge) {
    fly.angle = Math.PI - fly.angle;                     // flip left/right
    fly.x = Math.min(Math.max(fly.x, edge), canvas.width - edge);
  }
  if (fly.y < edge || fly.y > canvas.height - edge) {
    fly.angle = -fly.angle;                              // flip up/down
    fly.y = Math.min(Math.max(fly.y, edge), canvas.height - edge);
  }
}

// =====================================================
//  THE TONGUE
//  If a fly is close enough IN FRONT of the gecko,
//  the tongue shoots out, grabs it, and pulls it back.
// =====================================================

function tryToCatchAFly() {
  const head = cellCenter(gecko[0]);
  for (const fly of flies) {
    const dx = fly.x - head.x;
    const dy = fly.y - head.y;
    const inFront = dx * direction.x + dy * direction.y > 0;   // is the fly on the side the gecko is facing?
    const closeEnough = distance(fly, head) < TONGUE_RANGE;
    const touching = distance(fly, head) < CELL * 0.7;         // right next to the head counts too
    if ((inFront && closeEnough) || touching) {
      tongue = { fly: fly, timeLeft: TONGUE_TIME };
      eatFly(fly);
      return;                                                 // one fly at a time!
    }
  }
}

function updateTongue(seconds) {
  if (tongue === null) return;
  tongue.timeLeft = tongue.timeLeft - seconds;
  if (tongue.timeLeft <= 0) tongue = null;                    // tongue is back in the mouth
}

// How far out the tongue is: 0 = in the mouth, 1 = at the fly. It goes 0 -> 1 -> 0.
function tongueReach() {
  const progress = 1 - tongue.timeLeft / TONGUE_TIME;         // 0 at the start, 1 at the end
  return progress < 0.5 ? progress * 2 : (1 - progress) * 2;
}

// Where the tip of the tongue is right now
function tongueTip() {
  const head = cellCenter(gecko[0]);
  const mouth = { x: head.x + direction.x * 11, y: head.y + direction.y * 11 };
  const reach = tongueReach();
  return {
    x: mouth.x + (tongue.fly.x - mouth.x) * reach,
    y: mouth.y + (tongue.fly.y - mouth.y) * reach,
    mouth: mouth,
  };
}

// Is this square covered by any part of the gecko?
function isOnGecko(square) {
  for (const part of gecko) {
    if (part.x === square.x && part.y === square.y) return true;
  }
  return false;
}

function eatFly(fly) {
  flies = flies.filter((other) => other !== fly);   // take this fly out of the list
  score = score + 1;          // more flies = faster gecko (see currentSpeed)
  soundEat();

  // Every 10 flies: next level, and here comes the bat!
  if (score % FLIES_PER_LEVEL === 0) {
    level = level + 1;
    document.getElementById("info").innerHTML = `<b>Level ${level}!</b> <b>A bat is coming!</b> Survive 10 seconds.`;
    soundLevelUp();
    spawnBat();
    soundBat();
  }
  updateStats();
}

// How long to wait between moves: shorter (faster) for every fly eaten
function currentSpeed() {
  const speed = START_SPEED - score * SPEED_UP_PER_FLY;
  return Math.max(speed, FASTEST_SPEED);   // whichever is bigger, so it never goes below FASTEST_SPEED
}

// Show the score, level and best score on the page
function updateStats() {
  document.getElementById("score").textContent = score;
  document.getElementById("level").textContent = level;
  document.getElementById("best").textContent = best;
}

// =====================================================
//  DRAWING
// =====================================================

// The center of a grid square, in pixels
function cellCenter(square) {
  return { x: square.x * CELL + CELL / 2, y: square.y * CELL + CELL / 2 };
}

// Draw everything: board, fly, gecko, bat, and any message on top
function draw() {
  drawBoard();
  for (const fly of flies) drawFly(fly);
  drawGecko();
  if (tongue !== null) {
    // The caught fly: first it waits for the tongue, then it rides back on the tip
    const goingBack = tongue.timeLeft < TONGUE_TIME / 2;
    drawFly(goingBack ? tongueTip() : tongue.fly);
  }
  drawBat();
  if (!started) drawStartScreen();
  else if (gameOver) drawGameOver();
  else if (paused) drawOverlay("PAUSED", "Press P to keep playing");
}

// The fly: a black body, two buzzing wings, and it jitters a little in place
function drawFly(fly) {
  const time = performance.now();
  const x = fly.x + Math.sin(time / 60) * 1.5;        // tiny buzzing wobble
  const y = fly.y + Math.cos(time / 45) * 1.5;
  const wing = 3 + Math.abs(Math.sin(time / 25)) * 3; // wings flap fast

  pen.fillStyle = "rgba(200, 230, 255, 0.85)";        // see-through wings
  pen.beginPath();
  pen.ellipse(x - 4, y - 4, wing, 3, -0.6, 0, Math.PI * 2);
  pen.ellipse(x + 4, y - 4, wing, 3, 0.6, 0, Math.PI * 2);
  pen.fill();
  pen.fillStyle = "#1a1a1a";                          // body
  pen.beginPath();
  pen.ellipse(x, y, 4, 5, 0, 0, Math.PI * 2);
  pen.fill();
  pen.fillStyle = "#c0392b";                          // red eyes
  pen.fillRect(x - 3, y - 5, 2, 2);
  pen.fillRect(x + 1, y - 5, 2, 2);
}

const GECKO_GREEN = "#4caf50";
const GECKO_DARK = "#2e7d32";

// The gecko is drawn from back to front: tail, legs, body, head
function drawGecko() {
  const head = cellCenter(gecko[0]);
  const body = cellCenter(gecko[1]);
  const tail = cellCenter(gecko[2]);
  const bodyDir = { x: gecko[0].x - gecko[1].x, y: gecko[0].y - gecko[1].y };   // from body toward head
  const tailDir = { x: gecko[1].x - gecko[2].x, y: gecko[1].y - gecko[2].y };   // from tail toward body

  drawTail(body, tail, tailDir);
  drawLegs(body, bodyDir);

  // Neck: a thick round line from the body to the head
  pen.strokeStyle = GECKO_GREEN;
  pen.lineWidth = 14;
  pen.lineCap = "round";
  pen.beginPath();
  pen.moveTo(body.x, body.y);
  pen.lineTo(head.x, head.y);
  pen.stroke();

  // Body: a round shape with dark spots
  pen.fillStyle = GECKO_GREEN;
  pen.beginPath();
  pen.arc(body.x, body.y, 9, 0, Math.PI * 2);
  pen.fill();
  pen.fillStyle = GECKO_DARK;
  for (const spot of [{ x: -3, y: -2 }, { x: 3, y: 2 }, { x: 2, y: -4 }, { x: -2, y: 4 }]) {
    pen.beginPath();
    pen.arc(body.x + spot.x, body.y + spot.y, 1.6, 0, Math.PI * 2);
    pen.fill();
  }

  drawGeckoHead(head, direction);
}

// The tail: a long triangle that gets thinner toward the tip
function drawTail(body, tail, dir) {
  const side = { x: -dir.y, y: dir.x };               // turned 90 degrees: points to the gecko's side
  pen.fillStyle = GECKO_GREEN;
  pen.beginPath();
  pen.moveTo(body.x + side.x * 6, body.y + side.y * 6);      // wide end, one side
  pen.lineTo(tail.x - dir.x * 10, tail.y - dir.y * 10);      // pointy tip, past the tail square
  pen.lineTo(body.x - side.x * 6, body.y - side.y * 6);      // wide end, other side
  pen.closePath();
  pen.fill();
}

// Four legs with sticky toe pads. They swing back and forth as the gecko walks.
function drawLegs(body, dir) {
  const side = { x: -dir.y, y: dir.x };
  const swing = steps % 2 === 0 ? 3 : -3;             // flips every step, so the legs wiggle
  pen.strokeStyle = GECKO_GREEN;
  pen.fillStyle = GECKO_DARK;
  pen.lineWidth = 3;
  pen.lineCap = "round";

  for (const frontOrBack of [1, -1]) {                // 1 = front legs, -1 = back legs
    for (const whichSide of [1, -1]) {                // 1 = one side, -1 = the other side
      const startX = body.x + dir.x * 5 * frontOrBack;
      const startY = body.y + dir.y * 5 * frontOrBack;
      const legSwing = swing * frontOrBack * whichSide;  // opposite legs move together, like a real lizard
      const footX = startX + side.x * 12 * whichSide + dir.x * legSwing;
      const footY = startY + side.y * 12 * whichSide + dir.y * legSwing;
      pen.beginPath();
      pen.moveTo(startX, startY);
      pen.lineTo(footX, footY);
      pen.stroke();
      pen.beginPath();
      pen.arc(footX, footY, 2.5, 0, Math.PI * 2);     // toe pad
      pen.fill();
    }
  }
}

// The head: round with a snout, big golden eyes with slit pupils, and the tongue when it's out
function drawGeckoHead(head, forward) {
  const side = { x: -forward.y, y: forward.x };

  // Tongue: only shown while it's grabbing a fly
  if (tongue !== null) {
    const tip = tongueTip();
    pen.strokeStyle = "#e0344b";
    pen.lineWidth = 3;
    pen.lineCap = "round";
    pen.beginPath();
    pen.moveTo(tip.mouth.x, tip.mouth.y);
    pen.lineTo(tip.x, tip.y);
    pen.stroke();
    pen.fillStyle = "#e0344b";                        // a sticky round tip
    pen.beginPath();
    pen.arc(tip.x, tip.y, 3, 0, Math.PI * 2);
    pen.fill();
  }

  pen.fillStyle = GECKO_GREEN;
  pen.beginPath();
  pen.arc(head.x, head.y, 10.5, 0, Math.PI * 2);                              // head: big and round
  pen.arc(head.x + forward.x * 4, head.y + forward.y * 4, 7, 0, Math.PI * 2); // a short, round snout
  pen.fill();

  const angle = Math.atan2(forward.y, forward.x);     // which way the head points, as an angle
  for (const whichSide of [1, -1]) {
    const eyeX = head.x + forward.x * 1.5 + side.x * 7 * whichSide;
    const eyeY = head.y + forward.y * 1.5 + side.y * 7 * whichSide;
    pen.fillStyle = "#f2c14e";                        // big golden eye
    pen.beginPath();
    pen.arc(eyeX, eyeY, 4.5, 0, Math.PI * 2);
    pen.fill();
    pen.fillStyle = "#111111";                        // thin slit pupil, like a real gecko
    pen.beginPath();
    pen.ellipse(eyeX, eyeY, 1.1, 3, angle, 0, Math.PI * 2);
    pen.fill();
  }
}

// Darken the board and write a big title with a smaller line under it
function drawOverlay(title, subtitle, titleSize = 28) {
  pen.fillStyle = "rgba(25, 18, 10, 0.7)";
  pen.fillRect(0, 0, canvas.width, canvas.height);
  pen.fillStyle = "#8bd450";
  pen.textAlign = "center";
  pen.font = `${titleSize}px "Press Start 2P", monospace`;
  pen.fillText(title, canvas.width / 2, canvas.height / 2);
  pen.fillStyle = "#f3ead9";
  pen.font = '11px "Press Start 2P", monospace';
  pen.fillText(subtitle, canvas.width / 2, canvas.height / 2 + 40);
}

function drawGameOver() {
  drawOverlay("GAME OVER", "Press SPACE to play again");
  if (newBest) {
    pen.fillStyle = "#f2c14e";
    pen.font = '14px "Press Start 2P", monospace';
    pen.fillText(`NEW BEST: ${best}!`, canvas.width / 2, canvas.height / 2 - 50);
  }
}

function drawStartScreen() {
  drawOverlay("THE GECKO AND THE BAT", "Press an arrow key to start", 18);
  if (best > 0) {
    pen.fillStyle = "#b8a68a";
    pen.font = '11px "Press Start 2P", monospace';
    pen.fillText(`Best so far: ${best} flies`, canvas.width / 2, canvas.height / 2 + 70);
  }
}

// =====================================================
//  GAME OVER, BEST SCORE AND SOUNDS
// =====================================================

// Every way the game can end comes through here
function endGame(message) {
  gameOver = true;
  soundGameOver();
  if (score > best) {
    best = score;
    newBest = true;
    saveBest();
    updateStats();
    message = message + " <b>New best score!</b>";
    soundLevelUp(1.8);      // a happy tune after the sad one
  }
  document.getElementById("info").innerHTML = message;
}

// Best score: the browser keeps a little note for us (localStorage)
function loadBest() {
  try {
    return Number(localStorage.getItem("gecko-and-bat-best")) || 0;
  } catch (error) {
    return 0;               // some browsers don't allow notes: then we just start at 0
  }
}

function saveBest() {
  try {
    localStorage.setItem("gecko-and-bat-best", best);
  } catch (error) {
    // couldn't save the note: that's OK, the game still works
  }
}

// Sounds: we make them ourselves with the browser's tiny synthesizer
let audio = null;

// Browsers only allow sound after you press a key or click, so we switch it on then
function startAudio() {
  if (audio === null) {
    try { audio = new AudioContext(); } catch (error) { return; }
  }
  if (audio.state === "suspended") audio.resume();
}

// Play one note. freq = how high (in Hz), startIn = wait this many seconds first,
// length = how long, type = the kind of sound wave, endFreq = slide to this pitch
function beep(freq, startIn, length, type = "square", endFreq = freq) {
  if (!soundOn || audio === null) return;
  const start = audio.currentTime + startIn;
  const note = audio.createOscillator();       // makes the sound wave
  const volume = audio.createGain();           // a volume knob
  note.type = type;
  note.frequency.setValueAtTime(freq, start);
  note.frequency.exponentialRampToValueAtTime(endFreq, start + length);
  volume.gain.setValueAtTime(0.12, start);
  volume.gain.exponentialRampToValueAtTime(0.001, start + length);   // fade out
  note.connect(volume).connect(audio.destination);                  // wave -> knob -> speakers
  note.start(start);
  note.stop(start + length);
}

function soundEat()  { beep(300, 0, 0.1, "square", 700); }               // a quick "gulp!"
function soundLevelUp(delay = 0) {                                       // da-da-da-DAA!
  const notes = [523, 659, 784, 1047];
  for (let i = 0; i < notes.length; i++) beep(notes[i], delay + i * 0.1, 0.15);
}
function soundBat() {                                                    // screech, screech!
  beep(1500, 0.5, 0.25, "sawtooth", 500);
  beep(1500, 0.8, 0.25, "sawtooth", 500);
}
function soundPhew() {                                                   // the bat flew away
  beep(500, 0, 0.15, "triangle", 700);
  beep(700, 0.15, 0.25, "triangle", 1000);
}
function soundGameOver() {                                               // wah, wah, wah, waaaah
  const notes = [440, 370, 311];
  for (let i = 0; i < notes.length; i++) beep(notes[i], i * 0.3, 0.28, "triangle");
  beep(262, 0.9, 0.8, "triangle", 200);
}

// =====================================================
//  THE BAT
//  Every new level, a warning mark appears on a random
//  square. Half a second later, the bat pops out there!
//  For 10 seconds it flies straight toward the gecko's
//  head. If it gets there, game over! If time runs out,
//  it flies away. The bat flies freely, so it lives in pixels.
//  The bat's moods (states): "warning" -> "chasing" -> "leaving"
// =====================================================

// Pick a random square (not under the gecko) and show the warning there
function spawnBat() {
  let square;
  do {
    square = {
      x: Math.floor(Math.random() * GRID_SIZE),
      y: Math.floor(Math.random() * GRID_SIZE),
    };
  } while (isOnGecko(square));

  const center = cellCenter(square);
  bat = { x: center.x, y: center.y, state: "warning", warningLeft: BAT_WARNING_TIME, timeLeft: BAT_CHASE_TIME };
}

// How far apart are two points? (Pythagoras: a² + b² = c²)
function distance(a, b) {
  return Math.hypot(a.x - b.x, a.y - b.y);
}

// How fast the bat flies, in pixels per second
function batSpeed() {
  const ratio = Math.min(BAT_START_RATIO + (level - 2) * BAT_RATIO_PER_LEVEL, BAT_MAX_RATIO);
  const geckoSquaresPerSecond = 1000 / currentSpeed();
  return ratio * geckoSquaresPerSecond * CELL;
}

// Move the bat a little. "seconds" is how much time passed since last time (a tiny bit, like 0.016)
function updateBat(seconds) {
  if (bat === null) return;   // no bat right now

  if (bat.state === "warning") {
    // Count down the warning. When it's over, the bat appears and starts chasing.
    bat.warningLeft = bat.warningLeft - seconds;
    if (bat.warningLeft <= 0) bat.state = "chasing";
    return;
  }

  if (bat.state === "chasing") {
    bat.timeLeft = bat.timeLeft - seconds;
    if (bat.timeLeft <= 0) {
      bat.state = "leaving";
      soundPhew();
      document.getElementById("info").innerHTML = "Phew! The bat <b>gave up</b> and flew away.";
      return;
    }

    // Fly toward the head: find the direction, then take a small step that way
    const target = cellCenter(gecko[0]);
    const dx = target.x - bat.x;          // how far to go left/right
    const dy = target.y - bat.y;          // how far to go up/down
    const dist = distance(bat, target);
    const step = batSpeed() * seconds;    // how far the bat can fly in this little bit of time
    if (dist > 0) {
      bat.x = bat.x + (dx / dist) * step;
      bat.y = bat.y + (dy / dist) * step;
    }

    // Did it catch the head?
    if (distance(bat, cellCenter(gecko[0])) < CATCH_DISTANCE) {
      endGame("Eek! <b>The bat caught you.</b>");
    }
  } else {
    // Leaving: fly up and away, fast, until it's off the board
    bat.y = bat.y - 300 * seconds;
    if (bat.y < -CELL * 2) bat = null;    // gone!
  }
}

// Draw the bat: a round body, two flapping wings, ears and yellow eyes
function drawBat() {
  if (bat === null) return;
  const x = bat.x;
  const y = bat.y;

  // Warning: a blinking red square with a growing shadow where the bat will appear
  if (bat.state === "warning") {
    const grow = 1 - bat.warningLeft / BAT_WARNING_TIME;     // goes from 0 to 1 during the warning
    const blinkOn = Math.floor(performance.now() / 100) % 2 === 0;
    pen.fillStyle = "rgba(42, 31, 61, 0.45)";                 // the bat's shadow, getting bigger
    pen.beginPath();
    pen.ellipse(x, y, 4 + grow * 10, 2 + grow * 5, 0, 0, Math.PI * 2);
    pen.fill();
    if (blinkOn) {
      pen.strokeStyle = "#d93a3a";
      pen.lineWidth = 3;
      pen.strokeRect(x - CELL / 2 + 2, y - CELL / 2 + 2, CELL - 4, CELL - 4);
    }
    return;                                                   // no bat yet!
  }

  const flap = Math.sin(performance.now() / 70) * 6;   // goes up and down over time

  pen.fillStyle = "#2a1f3d";
  // Left wing
  pen.beginPath();
  pen.moveTo(x - 4, y);
  pen.lineTo(x - 20, y - 6 + flap);
  pen.lineTo(x - 14, y + 2);
  pen.lineTo(x - 9, y + 7);
  pen.closePath();
  pen.fill();
  // Right wing (the same, mirrored)
  pen.beginPath();
  pen.moveTo(x + 4, y);
  pen.lineTo(x + 20, y - 6 + flap);
  pen.lineTo(x + 14, y + 2);
  pen.lineTo(x + 9, y + 7);
  pen.closePath();
  pen.fill();
  // Ears
  pen.beginPath();
  pen.moveTo(x - 6, y - 4); pen.lineTo(x - 4, y - 12); pen.lineTo(x - 1, y - 5);
  pen.moveTo(x + 6, y - 4); pen.lineTo(x + 4, y - 12); pen.lineTo(x + 1, y - 5);
  pen.fill();
  // Body
  pen.beginPath();
  pen.arc(x, y, 8, 0, Math.PI * 2);
  pen.fill();
  // Eyes
  pen.fillStyle = "#ffd23f";
  pen.fillRect(x - 4, y - 3, 3, 3);
  pen.fillRect(x + 1, y - 3, 3, 3);

  // The countdown in the top corner
  if (bat.state === "chasing") {
    pen.fillStyle = "#3d2a17";
    pen.textAlign = "right";
    pen.font = '14px "Press Start 2P", monospace';
    pen.fillText(`BAT ${Math.ceil(bat.timeLeft)}`, canvas.width - 10, 24);
  }
}

// =====================================================
//  THE LOOPS AND THE KEYBOARD
// =====================================================

// THE ANIMATION LOOP: about 60 times a second, move the bat and redraw.
// (The gecko moves on its own heartbeat, square by square.)
let lastTime = performance.now();
function animationFrame(now) {
  const seconds = Math.min((now - lastTime) / 1000, 0.1);   // time since the last frame
  lastTime = now;
  if (!gameOver && !paused) {
    updateFlies(seconds);
    updateBat(seconds);
  }
  draw();
  requestAnimationFrame(animationFrame);
}

// THE GAME LOOP: check the next square, then move
function gameLoop() {
  if (!started || gameOver || paused) return;   // not started, crashed, or paused: do nothing

  direction = nextDirection;
  const newHead = nextHead();

  if (isOutside(newHead)) {
    endGame("Bonk! The gecko <b>hit the wall</b>.");   // we check BEFORE moving, so the gecko stays on the board
    return;
  }
  moveGecko(newHead);
}

// The heartbeat: run the game loop, then wait (shorter with every fly), then do it again
function heartbeat() {
  gameLoop();
  setTimeout(heartbeat, currentSpeed());
}

// Listen for the keyboard
document.addEventListener("keydown", (event) => {
  startAudio();                   // the first key press switches sound on

  // M: sound on or off (works any time)
  if (event.key === "m" || event.key === "M") {
    toggleSound();
    return;
  }

  // After a crash, SPACE starts a new game and the arrow keys do nothing
  if (gameOver) {
    if (event.key === " ") {
      event.preventDefault();
      resetGame();
    }
    return;
  }

  // P: pause or keep playing (only once the game has started)
  if ((event.key === "p" || event.key === "P") && started) {
    paused = !paused;             // flip the switch: true becomes false, false becomes true
    document.getElementById("info").innerHTML = paused
      ? "Paused. Press <b>P</b> to keep playing."
      : "Steer with the <b>arrow keys</b>.";
    return;
  }
  if (paused) return;             // while paused, the arrow keys do nothing

  let wanted = null;
  if (event.key === "ArrowUp")    wanted = UP;
  if (event.key === "ArrowDown")  wanted = DOWN;
  if (event.key === "ArrowLeft")  wanted = LEFT;
  if (event.key === "ArrowRight") wanted = RIGHT;
  if (wanted === null) return;    // some other key: ignore it

  event.preventDefault();         // stop the arrow keys from scrolling the page

  // The gecko can't turn straight back into its own body
  const isBackwards = wanted.x === -direction.x && wanted.y === -direction.y;
  if (!isBackwards) nextDirection = wanted;

  if (!started) {
    started = true;
    document.getElementById("info").innerHTML = "Steer with the <b>arrow keys</b>. Catch the flies!";
  }
});

document.getElementById("restart").addEventListener("click", (event) => {
  event.currentTarget.blur();     // so the arrow keys go to the game, not the button
  startAudio();
  resetGame();
});

function toggleSound() {
  soundOn = !soundOn;
  document.getElementById("sound").textContent = soundOn ? "Sound: on" : "Sound: off";
}

document.getElementById("sound").addEventListener("click", (event) => {
  event.currentTarget.blur();
  startAudio();
  toggleSound();
});

// Start!
resetGame();
heartbeat();
requestAnimationFrame(animationFrame);
</script>
</body>
