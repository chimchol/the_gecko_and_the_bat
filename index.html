<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Gecko and the Bat</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Nunito:wght@400;700&display=swap">
<style>
  /* Layout: one centered column, the game board is the hero. Single dark "desert night" look on purpose. */
  :root {
    --bg: #1f1812;        /* page background, dark brown */
    --panel: #2c2219;
    --text: #f3ead9;
    --muted: #b8a68a;
    --accent: #8bd450;    /* gecko green, used for headings and buttons */
    --font-display: "Press Start 2P", ui-monospace, monospace;
    --font-body: "Nunito", system-ui, sans-serif;
    color-scheme: dark;
  }
  html, body { background: var(--bg); color: var(--text); }
  body { margin: 0;
    font-family: var(--font-body);
    font-size: 16px;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    padding-block: 24px;
  }
  main { max-width: 520px; margin: 0 auto; display: flex; flex-direction: column; gap: 16px; }
  h1 { font-family: var(--font-display); font-size: 18px; color: var(--accent); margin: 0; line-height: 1.6; text-wrap: balance; }
  .step { font-family: var(--font-display); font-size: 10px; letter-spacing: 0.08em; color: var(--muted); }
  canvas { touch-action: none; }   /* swipes on the board steer the gecko instead of scrolling the page */
  .pad { display: none; grid-template-columns: repeat(3, 72px); grid-template-rows: repeat(2, 56px); gap: 8px;
         grid-template-areas: ". up ." "left down right"; justify-content: center; }
  @media (pointer: coarse) { .pad { display: grid; } }   /* only on phones and tablets */
  .pad button { font-family: system-ui, sans-serif; font-size: 22px; padding: 0; touch-action: manipulation;
                background: var(--panel); color: var(--text); box-shadow: inset 0 0 0 2px var(--muted); }
  .pad button:active { background: var(--accent); color: #142008; }
  canvas { width: 100%; max-width: 480px; aspect-ratio: 1; display: block; border-radius: 6px;
           box-shadow: 0 0 0 4px #6b4a2b, 0 0 0 7px #3d2a17; }
  .stats { display: flex; gap: 12px; }
  .stat { flex: 1; background: var(--panel); border-radius: 6px; padding: 10px 14px; display: flex; justify-content: space-between; align-items: baseline; }
  .stat span { font-size: 13px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.08em; }
  .stat b { font-family: var(--font-display); font-size: 16px; color: var(--accent); font-variant-numeric: tabular-nums; }
  .bar { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
  .info { flex: 1; min-width: 0; background: var(--panel); border-radius: 6px; padding: 12px 14px; color: var(--muted); line-height: 1.5; }
  .info b { color: var(--text); }
  button { font-family: var(--font-display); font-size: 10px; background: var(--accent); color: #142008;
           border: 0; border-radius: 6px; padding: 14px 16px; cursor: pointer; }
  button.secondary { background: var(--panel); color: var(--text); box-shadow: inset 0 0 0 2px var(--muted); }
  button:focus-visible { outline: 3px solid var(--text); outline-offset: 2px; }
</style>
</head>
<body>

<main>
  <h1>The Gecko and the Bat</h1>
  <div class="stats">
    <div class="stat"><span>Flies</span><b id="score">0</b></div>
    <div class="stat"><span>Level</span><b id="level">1</b></div>
    <div class="stat"><span>Best</span><b id="best">0</b></div>
  </div>
  <canvas id="board" width="480" height="480"></canvas>
  <div class="pad" id="pad">
    <button data-dir="up" style="grid-area: up" aria-label="Up">▲</button>
    <button data-dir="left" style="grid-area: left" aria-label="Left">◀</button>
    <button data-dir="down" style="grid-area: down" aria-label="Down">▼</button>
    <button data-dir="right" style="grid-area: right" aria-label="Right">▶</button>
  </div>
  <div class="bar">
    <div class="info" id="info">Press an <b>arrow key</b> to start.</div>
    <button id="pause" class="secondary">Pause</button>
    <button id="sound" class="secondary">Sound: on</button>
    <button id="restart">Restart</button>
  </div>
</main>

<script src="constants.js"></script>
<script src="drawing.js"></script>
<script src="game.js"></script>
</body>
</html>
